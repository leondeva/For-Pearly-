<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Pearly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="spring-day.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="question-screen">
        <img src="kuromi.png" alt="Kuromi" class="main-img">
        <h1>Pearly will you please forgive me?</h1>
        <div class="buttons">
            <button class="yes-button" onclick="showSuccess()">Yes</button>
            <button class="no-button" id="noButton">No</button>
        </div>
    </div>

    <div class="container hidden" id="success-screen">
        <img src="jimin.jpg" alt="Jimin" class="success-img">
        <h2>Thank you so much for forgiving me, Jimin appreciates you 🙏🏻❤️</h2>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        let hasPlayed = false;

        // Bulletproof audio starter
        function forcePlayAudio() {
            if (!hasPlayed) {
                audio.play().then(() => {
                    hasPlayed = true;
                }).catch(err => {
                    console.log("Browser still blocking audio:", err);
                });
            }
        }

        // We attach the music trigger to the entire window AND the buttons
        window.addEventListener('click', forcePlayAudio);
        window.addEventListener('touchstart', forcePlayAudio);

        // Make the "No" button run away
        const noBtn = document.getElementById('noButton');
        
        function moveButton() {
            const padding = 20; 
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            
            // Also try playing music when they try to touch the No button
            forcePlayAudio(); 
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            moveButton();
        });

        // Switch to Jimin screen when "Yes" is clicked
        function showSuccess() {
            forcePlayAudio(); // Try playing one last time if they click Yes
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
        }
    </script>
</body>
</html>
